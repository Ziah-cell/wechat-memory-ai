[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-memory-ai"
version = "0.1.1"
description = "Offline-first conversation and memory core; real WeChat adapter not implemented"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wechat-memory = "wechat_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
