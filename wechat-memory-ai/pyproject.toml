[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-memory-ai"
version = "0.1.2"
description = "Offline-first memory core with read-only Windows UIA diagnostics; no real messaging"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wechat-memory = "wechat_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wechat_memory = ["uia_*.ps1"]
